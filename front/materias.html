<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matérias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id = "header-page">

        <a href="index.html"><h1>Escola DHL</h1></a>

        <nav>
            <a href="">Matérias</a>
        </nav>
    </header>


    <main class="container">
        <header class="header">
            <h1>Lista de Matérias da Escola</h1>
            <p>Lista com as matérias e os seus respectivos professores.</p>
        </header>
 
        <form id="form-materia">
            <div class="input-group">
                <input 
                    type="text" 
                    id="input-nome" 
                    placeholder="Nome da matéria" 
                    required
                >
                <input 
                    type="text" 
                    id="input-professor" 
                    step="0.01" 
                    placeholder="Nome do professor" 
                    required
                >
            </div>
            <button type="submit" id="btn-adicionar">Adicionar à Lista</button>
        </form>

        
        <ul id="lista-materias">
            
        </ul>

        
        <footer class="rodape-total">
            <span>Total de matérias:</span>
            <strong id="total-materias">0</strong>
        </footer>
    </main>


    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      mostrarMaterias();
    });
    </script>
</body>
</html>
